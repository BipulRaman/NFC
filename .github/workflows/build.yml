name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Read-only by default; only the release-only publish job can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: nfc-studio.exe
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: nfc-studio
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: nfc-studio
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: nfc-studio
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like 1.0.0 (or v1.0.0)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sed -i.bak "s/^version = \".*\"/version = \"$version\"/" Cargo.toml && rm Cargo.toml.bak

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpcsclite-dev libxkbcommon-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p dist out
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../out/nfc-studio-$VERSION-${{ matrix.name }}.zip" ${{ matrix.exe }}
          else
            tar czf "../out/nfc-studio-$VERSION-${{ matrix.name }}.tar.gz" ${{ matrix.exe }}
          fi

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: release-${{ matrix.name }}
          path: app/desktop/out/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like 1.0.0 (or v1.0.0)"
            exit 1
          fi
          # 1.2.3 -> 10203; Android needs a growing integer versionCode.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION_ARGS=-PappVersionName=$version -PappVersionCode=$code" >> "$GITHUB_ENV"
          sed -i "s/^version = \".*\"/version = \"$version\"/" app/android/rust/Cargo.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Use preinstalled NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/android/rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Test JNI crate
        working-directory: app/android/rust
        run: cargo test

      - name: Build native libraries
        working-directory: app/android/rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        if: github.event_name != 'release'
        working-directory: app/android
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK
        if: github.event_name == 'release'
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; release APKs must be signed with the permanent key so updates install"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon assembleRelease $GRADLE_VERSION_ARGS
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Package APK
        if: github.event_name == 'release'
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/nfc-studio-$VERSION-android.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: release-android
          path: out/*

  publish:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" assets/* --clobber --repo "${{ github.repository }}"
