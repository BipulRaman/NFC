name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: nfc-studio.exe
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: nfc-studio
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: nfc-studio
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: nfc-studio
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like 1.0.0 (or v1.0.0)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sed -i.bak "s/^version = \".*\"/version = \"$version\"/" Cargo.toml && rm Cargo.toml.bak

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpcsclite-dev libxkbcommon-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package and upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset=nfc-studio-$VERSION-${{ matrix.name }}.zip
            7z a "../$asset" ${{ matrix.exe }}
          else
            asset=nfc-studio-$VERSION-${{ matrix.name }}.tar.gz
            tar czf "../$asset" ${{ matrix.exe }}
          fi
          cd ..
          gh release upload "${{ github.event.release.tag_name }}" "$asset" --clobber

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like 1.0.0 (or v1.0.0)"
            exit 1
          fi
          # 1.2.3 -> 10203; Android needs a growing integer versionCode.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION_ARGS=-PappVersionName=$version -PappVersionCode=$code" >> "$GITHUB_ENV"
          sed -i "s/^version = \".*\"/version = \"$version\"/" app/android/rust/Cargo.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Use preinstalled NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/android/rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Test JNI crate
        working-directory: app/android/rust
        run: cargo test

      - name: Build native libraries
        working-directory: app/android/rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: app/android
        run: gradle --no-daemon assembleDebug $GRADLE_VERSION_ARGS

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=nfc-studio-$VERSION-android.apk
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "$asset"
          gh release upload "${{ github.event.release.tag_name }}" "$asset" --clobber --repo "${{ github.repository }}"
